<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marsupilami - GAME OVER</title>
  <meta name="description" content="Marsupilami Game Over - Play Again or return Home">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@600;800&display=swap">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000000;
      font-family: 'Outfit', sans-serif;
    }

    /* FULL SCREEN CONTAINER (100vw x 100vh) */
    .gameover-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    /* Authentic Game Over artwork filling 100% of screen */
    .gameover-img {
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      display: block;
      pointer-events: none;
    }

    /* Top Left Home Button */
    .btn-home {
      position: absolute;
      top: 20px;
      left: 24px;
      z-index: 50;
      background: rgba(8, 41, 22, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2px solid #f4d03f;
      color: #ffffff;
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      text-decoration: none;
      padding: 10px 24px;
      border-radius: 50px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn-home:hover {
      transform: scale(1.08);
      background: #f4d03f;
      color: #071f11;
      border-color: #ffffff;
      box-shadow: 0 8px 25px rgba(244, 208, 63, 0.8);
    }

    .btn-home:active {
      transform: scale(0.96);
    }

    /* Top Right Stats Pill */
    .stats-pill {
      position: absolute;
      top: 20px;
      right: 24px;
      z-index: 50;
      background: rgba(8, 41, 22, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2px solid rgba(244, 208, 63, 0.7);
      border-radius: 35px;
      padding: 10px 24px;
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 1.15rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }

    .stat-val-score { color: #f4d03f; font-weight: 700; }
    .stat-val-dist  { color: #80d8ff; font-weight: 700; }
    .stat-val-best  { color: #69f0ae; font-weight: 700; }

    /* Interactive Hotspot Button on the "PLAY AGAIN" pill in the image */
    .play-again-btn {
      position: absolute;
      left: 6%;
      top: 71%;
      width: 88%;
      height: 27%;
      border-radius: 999px;
      cursor: pointer;
      z-index: 40;
      background: transparent;
      border: none;
      outline: none;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .play-again-btn:hover {
      background: rgba(244, 208, 63, 0.18);
    }

    .play-again-btn:active {
      background: rgba(244, 208, 63, 0.35);
      transform: scale(0.98);
    }

    /* Page transition exit */
    .exit-anim {
      animation: fadeOut 0.25s ease-out forwards;
    }

    @keyframes fadeOut {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.04); }
    }
  </style>
</head>
<body>

  <div class="gameover-stage" id="stage">
    <!-- Full-screen authentic image -->
    <img src="assets/game_over.jpg?v=2026" alt="GAME OVER - PLAY AGAIN" class="gameover-img">

    <!-- Top Left Home Navigation -->
    <a href="index.html" class="btn-home" id="btnHome" title="Back to Home Page">
      <span>🏠</span>
      <span>HOME</span>
    </a>

    <!-- Top Right Stats Display -->
    <div class="stats-pill">
      <span>SCORE: <strong class="stat-val-score" id="valScore">0</strong></span>
      <span>•</span>
      <span>DIST: <strong class="stat-val-dist" id="valDist">0m</strong></span>
      <span>•</span>
      <span>BEST: <strong class="stat-val-best" id="valBest">0</strong></span>
    </div>

    <!-- Hotspot Button over the "PLAY AGAIN" pill -->
    <button class="play-again-btn" id="btnPlayAgain" title="PLAY AGAIN" aria-label="PLAY AGAIN"></button>
  </div>

  <script>
    // Load live scores from localStorage
    const score = localStorage.getItem('marsu_last_score') || '0';
    const dist = localStorage.getItem('marsu_last_distance') || '0';
    const best = localStorage.getItem('marsu_highscore') || '0';

    document.getElementById('valScore').textContent = score;
    document.getElementById('valDist').textContent = dist + 'm';
    document.getElementById('valBest').textContent = best;

    // Restart game function
    function playAgain() {
      const stage = document.getElementById('stage');
      stage.classList.add('exit-anim');
      setTimeout(() => {
        window.location.href = 'game.html?start=true';
      }, 150);
    }

    // Go Home function
    function goHome() {
      const stage = document.getElementById('stage');
      stage.classList.add('exit-anim');
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 150);
    }

    // Play Again button click
    document.getElementById('btnPlayAgain').addEventListener('click', playAgain);

    // Also allow clicking anywhere on the lower third of the screen
    document.getElementById('stage').addEventListener('click', (e) => {
      if (e.target.closest('#btnHome')) return;
      const yRatio = e.clientY / window.innerHeight;
      if (yRatio > 0.65) {
        playAgain();
      }
    });

    // Keyboard controls
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        playAgain();
      } else if (e.code === 'Escape' || e.key === 'h' || e.key === 'H') {
        e.preventDefault();
        goHome();
      }
    });
  </script>
</body>
</html>
